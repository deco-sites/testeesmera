name: Editorial media, product modal and Matter validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Apply guarded header cleanup
        run: python3 scripts/header_cleanup.py

      - name: Verify cleanup diff
        shell: bash
        run: |
          git diff --check
          git diff --stat

      - name: Upload cleaned header sources
        uses: actions/upload-artifact@v4
        with:
          name: header-cleanup-sources
          path: |
            static/esmera-master.css
            static/esmera-commerce-refine.css
            static/esmera-finish.css
            islands/EsmeraHeader.tsx
          if-no-files-found: error
          retention-days: 1
