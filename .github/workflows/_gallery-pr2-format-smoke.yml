name: Format canonical smoke

on:
  push:
    branches:
      - agent/gallery-pr2-media-contract

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt scripts/ci/editorial-modal-smoke.mjs
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/editorial-modal-smoke.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: format editorial modal smoke"
          git push
