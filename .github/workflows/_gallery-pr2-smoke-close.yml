name: Gallery PR2 smoke close fix

on:
  push:
    branches:
      - agent/gallery-pr2-media-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: python scripts/ci/_pr2_smoke_close_patch.py
      - run: deno fmt scripts/ci/editorial-modal-smoke.mjs
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/ci/_pr2_smoke_close_patch.py
          git add scripts/ci/editorial-modal-smoke.mjs
          git commit -m "test: close viewer explicitly in PR2 smoke"
          git push
