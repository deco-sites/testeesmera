name: Temporary restore PayloadHome validation

on:
  push:
    branches:
      - fix/restore-payload-home-manifest
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: payload-home-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.json') }}

      - name: Pre-cache entrypoint dependencies
        run: deno cache dev.ts main.ts

      - name: Regenerate Deco manifest
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          cp dev.ts /tmp/dev.ts.original
          trap 'cp /tmp/dev.ts.original dev.ts' EXIT

          # Tailwind's full dependency graph is unrelated to manifest generation
          # and can remain alive for several minutes in CI. Skip only that call
          # in this disposable checkout, then run the requested task unchanged.
          python3 - <<'PY'
          from pathlib import Path

          dev = Path('dev.ts')
          content = dev.read_text()
          original = 'await build();'
          assert original in content, 'Tailwind build call was not found in dev.ts'
          dev.write_text(content.replace(original, '// skipped only for CI manifest generation', 1))

          manifest = Path('manifest.gen.ts')
          generated = manifest.read_text()
          generated = generated.replace(
              'import * as $$$$$$8 from "./sections/Esmera/PayloadHome.tsx";\n',
              '',
          )
          generated = generated.replace(
              '    "site/sections/Esmera/PayloadHome.tsx": $$$$$$8,\n',
              '',
          )
          manifest.write_text(generated)
          PY

          if grep -Fq './sections/Esmera/PayloadHome.tsx' manifest.gen.ts; then
            echo "Failed to recreate the manifest regression before validation."
            exit 1
          fi

          deno task gen

          cp /tmp/dev.ts.original dev.ts
          trap - EXIT

          grep -F 'import * as $$$$$$8 from "./sections/Esmera/PayloadHome.tsx";' manifest.gen.ts
          grep -F '"site/sections/Esmera/PayloadHome.tsx": $$$$$$8,' manifest.gen.ts

      - name: Confirm generated files are current
        run: git diff --exit-code -- manifest.gen.ts .deco/metadata

      - name: Verify PayloadHome and preserved configuration
        shell: bash
        run: |
          grep -F 'site/sections/Esmera/PayloadHome.tsx' manifest.gen.ts
          python3 - <<'PY'
          import json
          from pathlib import Path

          home = json.loads(Path('.deco/blocks/pages-home.json').read_text())
          sections = home.get('sections', [])
          assert any(
              section.get('__resolveType') == 'site/sections/Esmera/PayloadHome.tsx'
              for section in sections
          ), 'pages-home.json no longer resolves PayloadHome'

          client = Path('lib/payload/client.ts').read_text()
          assert 'DEFAULT_PAYLOAD_API_URL' in client
          assert 'Deno.env.get("PAYLOAD_API_URL") || DEFAULT_PAYLOAD_API_URL' in client
          PY

      - name: Lint
        run: deno lint

      - name: Type-check entrypoints
        run: deno check dev.ts main.ts

      - name: Test
        run: deno test -A

      - name: Validate Deco project
        run: deno task validate

      - name: Build
        timeout-minutes: 15
        run: deno task build
