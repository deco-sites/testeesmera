name: Reconstruct Home autofix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.sha == 'b8a918a3eec883e5ad711fd3f942d332d433c1c2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Fix grouped image type and format repository
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/payload/adapters.ts')
          content = path.read_text()
          old = 'const group = value as Exclude<PayloadImageField, Relationship<PayloadMedia>>;'
          new = '''const group = value as {
              image?: Relationship<PayloadMedia>;
              alt?: string | null;
            };'''
          if old not in content:
              raise SystemExit('Expected grouped-image cast not found')
          path.write_text(content.replace(old, new))
          PY
          deno fmt
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "fix(home): format reconstruction and narrow image group type"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
