name: Storefront architecture validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DECO_SITE_NAME: testeesmera
      PAYLOAD_API_URL: https://esmeracms-green.vercel.app
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tests
        shell: bash
        run: |
          set +e
          deno test -A > test.log 2>&1
          status=$?
          cat test.log
          exit "$status"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test.log
          if-no-files-found: error
          retention-days: 1
