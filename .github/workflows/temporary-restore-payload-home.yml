name: Temporary restore PayloadHome validation

on:
  push:
    branches:
      - fix/restore-payload-home-manifest
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: payload-home-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.json') }}

      - name: Pre-cache entrypoint dependencies
        run: deno cache dev.ts main.ts

      - name: Regenerate Deco manifest
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cp manifest.gen.ts /tmp/manifest.gen.expected.ts

          # Recreate only the manifest regression inside the disposable runner.
          # This proves that the exact generation task restores PayloadHome.
          python3 - <<'PY'
          from pathlib import Path

          path = Path('manifest.gen.ts')
          content = path.read_text()
          content = content.replace(
              'import * as $$$$$$8 from "./sections/Esmera/PayloadHome.tsx";\n',
              '',
          )
          content = content.replace(
              '    "site/sections/Esmera/PayloadHome.tsx": $$$$$$8,\n',
              '',
          )
          path.write_text(content)
          PY

          if cmp -s manifest.gen.ts /tmp/manifest.gen.expected.ts; then
            echo "Failed to recreate the manifest regression before validation."
            exit 1
          fi

          deno task gen > /tmp/deno-task-gen.log 2>&1 &
          gen_pid=$!
          generated=false

          for _ in $(seq 1 240); do
            if cmp -s manifest.gen.ts /tmp/manifest.gen.expected.ts; then
              generated=true
              break
            fi

            if ! kill -0 "$gen_pid" 2>/dev/null; then
              set +e
              wait "$gen_pid"
              status=$?
              set -e
              cat /tmp/deno-task-gen.log
              echo "deno task gen exited before restoring the generated manifest (status $status)."
              exit 1
            fi

            sleep 1
          done

          if [ "$generated" != "true" ]; then
            cat /tmp/deno-task-gen.log
            echo "deno task gen did not restore manifest.gen.ts within the validation window."
            kill -TERM "$gen_pid" 2>/dev/null || true
            exit 1
          fi

          # gen-only has regenerated the file but keeps the development process alive.
          # Stop that persistent process after observing the generated output.
          kill -TERM "$gen_pid" 2>/dev/null || true
          sleep 2
          kill -KILL "$gen_pid" 2>/dev/null || true
          wait "$gen_pid" 2>/dev/null || true
          cat /tmp/deno-task-gen.log

          cmp -s manifest.gen.ts /tmp/manifest.gen.expected.ts
          grep -F 'site/sections/Esmera/PayloadHome.tsx' manifest.gen.ts

      - name: Confirm generated files are current
        run: git diff --exit-code -- manifest.gen.ts .deco/metadata

      - name: Verify PayloadHome and preserved configuration
        shell: bash
        run: |
          grep -F 'site/sections/Esmera/PayloadHome.tsx' manifest.gen.ts
          python3 - <<'PY'
          import json
          from pathlib import Path

          home = json.loads(Path('.deco/blocks/pages-home.json').read_text())
          sections = home.get('sections', [])
          assert any(
              section.get('__resolveType') == 'site/sections/Esmera/PayloadHome.tsx'
              for section in sections
          ), 'pages-home.json no longer resolves PayloadHome'

          client = Path('lib/payload/client.ts').read_text()
          assert 'DEFAULT_PAYLOAD_API_URL' in client
          assert 'Deno.env.get("PAYLOAD_API_URL") || DEFAULT_PAYLOAD_API_URL' in client
          PY

      - name: Lint
        run: deno lint

      - name: Type-check entrypoints
        run: deno check dev.ts main.ts

      - name: Test
        run: deno test -A

      - name: Validate Deco project
        run: deno task validate

      - name: Build
        run: deno task build
