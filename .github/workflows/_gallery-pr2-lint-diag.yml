name: Gallery PR2 lint fix

on:
  push:
    branches:
      - agent/gallery-pr2-media-contract

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - shell: bash
        run: |
          sed -i 's/window\.innerWidth/globalThis.innerWidth/g' scripts/ci/editorial-modal-smoke.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/editorial-modal-smoke.mjs
          git commit -m "fix(ci): satisfy Deno lint in editorial smoke"
          git push
