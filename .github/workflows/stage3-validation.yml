name: Stage 3 validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/stage3-validation.yml
      - .env.example
      - .gitignore
      - README.md
      - tests/payload/client_test.ts
      - lib/payload/client.ts
  push:
    branches:
      - agent/configure-payload-api-url-stage-3
    paths:
      - .github/workflows/stage3-validation.yml
      - .env.example
      - .gitignore
      - README.md
      - tests/payload/client_test.ts
      - lib/payload/client.ts

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Baseline format audit
        continue-on-error: true
        run: deno fmt --check

      - name: Stage 3 format
        run: deno fmt --check README.md tests/payload/client_test.ts

      - name: Lint
        run: deno lint

      - name: Typecheck
        run: deno check dev.ts main.ts

      - name: Tests
        run: deno test -A

      - name: Deco validate
        run: deno task validate

      - name: Build
        run: deno task build
