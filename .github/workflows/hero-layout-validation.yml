name: Hero layout validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAYLOAD_API_URL: https://esmeracms-green.vercel.app
      PORT: "8000"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Format
        run: deno fmt --check sections/Esmera/Hero.tsx islands/HeroCarousel.tsx tests/shell/storefront_shell_test.tsx
      - name: Lint
        run: deno lint
      - name: Typecheck
        run: deno check dev.ts main.ts
      - name: Tests
        run: deno test -A
      - name: Build
        run: deno task build
      - name: Start preview
        shell: bash
        run: |
          deno task preview > /tmp/esmera-preview.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/esmera-preview.log
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Verify Hero geometry
        shell: bash
        run: |
          cat > /tmp/hero-smoke.mjs <<'JS'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1648, height: 928 } });
          await page.goto("http://127.0.0.1:8000/", { waitUntil: "networkidle", timeout: 120000 });
          await page.waitForSelector(".esv-hero-statement", { state: "visible" });
          const geometry = await page.evaluate(() => {
            const hero = document.querySelector(".esv-hero");
            const content = document.querySelector(".esv-hero-content");
            const title = document.querySelector(".esv-hero-statement");
            const header = document.querySelector(".esv-header");
            if (!(hero instanceof HTMLElement) || !(content instanceof HTMLElement) || !(title instanceof HTMLElement) || !(header instanceof HTMLElement)) throw new Error("Hero elements missing");
            const heroRect = hero.getBoundingClientRect();
            const contentRect = content.getBoundingClientRect();
            const titleRect = title.getBoundingClientRect();
            const headerRect = header.getBoundingClientRect();
            return {
              display: getComputedStyle(hero).display,
              heroTop: heroRect.top,
              heroBottom: heroRect.bottom,
              contentTop: contentRect.top,
              contentBottom: contentRect.bottom,
              titleTop: titleRect.top,
              titleBottom: titleRect.bottom,
              headerBottom: headerRect.bottom,
              contentBottomGap: heroRect.bottom - contentRect.bottom,
            };
          });
          if (geometry.display !== "grid") throw new Error(`Hero display is ${geometry.display}`);
          if (geometry.titleTop <= geometry.headerBottom + 24) throw new Error(`Title overlaps header: ${JSON.stringify(geometry)}`);
          if (geometry.contentTop < geometry.heroBottom * 0.45) throw new Error(`Hero content is not in the lower half: ${JSON.stringify(geometry)}`);
          if (geometry.contentBottomGap < 32 || geometry.contentBottomGap > 100) throw new Error(`Hero content bottom spacing is invalid: ${JSON.stringify(geometry)}`);
          console.log(JSON.stringify(geometry));
          await browser.close();
          JS
          node /tmp/hero-smoke.mjs
