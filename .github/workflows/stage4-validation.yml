name: Stage 4 validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format changed files
        run: deno fmt --check lib/payload/client.ts lib/payload/errors.ts tests/payload/client_test.ts
      - name: Lint
        run: deno lint
      - name: Typecheck
        run: deno check dev.ts main.ts
      - name: Tests
        run: deno test -A
      - name: Build
        run: deno task build
      - name: Validate Payload production contract
        shell: bash
        run: |
          set -euo pipefail
          base="https://esmeracms-green.vercel.app"
          public_endpoints=(
            "/api/products?limit=1&depth=2"
            "/api/categories?limit=1&depth=2"
            "/api/media?limit=1"
            "/api/globals/home?depth=2"
            "/api/globals/navigation?depth=2"
            "/api/globals/site-settings?depth=2"
            "/api/globals/about?depth=2"
            "/api/globals/contact?depth=2"
            "/api/globals/collection-page?depth=2"
          )
          private_endpoints=(
            "/api/customers?limit=1"
            "/api/users?limit=1"
            "/api/sales?limit=1"
            "/api/after-sales?limit=1"
          )
          for endpoint in "${public_endpoints[@]}"; do
            code=$(curl --retry 3 --retry-delay 2 -sS -o response.json -w "%{http_code}" "$base$endpoint")
            echo "PUBLIC $endpoint -> $code"
            test "$code" = "200"
            jq empty response.json
          done
          for endpoint in "${private_endpoints[@]}"; do
            code=$(curl --retry 3 --retry-delay 2 -sS -o response.json -w "%{http_code}" "$base$endpoint")
            echo "PRIVATE $endpoint -> $code"
            test "$code" = "401" -o "$code" = "403"
            jq empty response.json
          done
