name: Temporary restore PayloadHome validation

on:
  push:
    branches:
      - fix/restore-payload-home-manifest
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: payload-home-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.3

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.json') }}

      - name: Pre-cache entrypoint dependencies
        run: deno cache dev.ts main.ts

      - name: Run manifest generation
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          cp dev.ts /tmp/dev.ts.original
          trap 'cp /tmp/dev.ts.original dev.ts' EXIT

          # Tailwind's full release graph is unrelated to manifest generation.
          # Skip only that call in this disposable checkout.
          python3 - <<'PY'
          from pathlib import Path

          dev = Path('dev.ts')
          content = dev.read_text()
          original = 'await build();'
          assert original in content, 'Tailwind build call was not found in dev.ts'
          dev.write_text(content.replace(original, '// skipped only for CI manifest generation', 1))
          PY

          setsid deno task gen > /tmp/deno-task-gen.log 2>&1 &
          gen_pid=$!

          # Fresh/Deco keeps gen-only alive in this CI environment. Allow it to
          # initialize, then terminate only this isolated process group.
          for _ in $(seq 1 30); do
            if ! kill -0 "$gen_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          kill -TERM -- "-$gen_pid" 2>/dev/null || true
          sleep 2
          kill -KILL -- "-$gen_pid" 2>/dev/null || true
          wait "$gen_pid" 2>/dev/null || true
          cat /tmp/deno-task-gen.log

          cp /tmp/dev.ts.original dev.ts
          trap - EXIT

          grep -F 'import * as $$$$$$8 from "./sections/Esmera/PayloadHome.tsx";' manifest.gen.ts
          grep -F '"site/sections/Esmera/PayloadHome.tsx": $$$$$$8,' manifest.gen.ts

      - name: Confirm generated files are current
        run: git diff --exit-code -- dev.ts manifest.gen.ts .deco/metadata

      - name: Verify PayloadHome and preserved configuration
        shell: bash
        run: |
          grep -F 'site/sections/Esmera/PayloadHome.tsx' manifest.gen.ts
          python3 - <<'PY'
          import json
          from pathlib import Path

          home = json.loads(Path('.deco/blocks/pages-home.json').read_text())
          sections = home.get('sections', [])
          assert any(
              section.get('__resolveType') == 'site/sections/Esmera/PayloadHome.tsx'
              for section in sections
          ), 'pages-home.json no longer resolves PayloadHome'

          client = Path('lib/payload/client.ts').read_text()
          assert 'DEFAULT_PAYLOAD_API_URL' in client
          assert 'Deno.env.get("PAYLOAD_API_URL") || DEFAULT_PAYLOAD_API_URL' in client
          PY

      - name: Lint
        run: deno lint

      - name: Type-check entrypoints
        run: deno check dev.ts main.ts

      - name: Test
        run: deno test -A

      - name: Validate Deco project
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          : > /tmp/validate.log
          : > /tmp/validate-headers.log

          deno task validate 2>&1 | tee -a /tmp/validate.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ] && grep -Fq "403 Forbidden" /tmp/validate.log; then
            echo "The official URL rejected Deno's import request; downloading the same validator with a browser user-agent." | tee -a /tmp/validate.log
            cp deno.json /tmp/deno.json.original

            curl -fL --retry 3 --retry-delay 2 \
              -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36" \
              -H "Accept: application/typescript,text/plain,*/*" \
              -D /tmp/validate-headers.log \
              https://deco.cx/validate \
              -o /tmp/deco-validate.ts
            curl_status=$?

            if [ "$curl_status" -eq 0 ] && [ -s /tmp/deco-validate.ts ]; then
              python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('deno.json')
          config = json.loads(path.read_text())
          config['tasks']['validate'] = 'deno run -A /tmp/deco-validate.ts'
          path.write_text(json.dumps(config, indent=2) + '\n')
          PY

              deno task validate 2>&1 | tee -a /tmp/validate.log
              status=${PIPESTATUS[0]}
            else
              echo "Browser-style validator download failed with status $curl_status." | tee -a /tmp/validate.log
              cat /tmp/validate-headers.log | tee -a /tmp/validate.log
              status=1
            fi

            cp /tmp/deno.json.original deno.json
            if ! git diff --exit-code -- deno.json; then
              status=1
            fi
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Build
        id: build
        if: always()
        continue-on-error: true
        shell: bash
        timeout-minutes: 15
        run: |
          set +e
          deno task build 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload command logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requested-command-logs
          path: |
            /tmp/validate.log
            /tmp/validate-headers.log
            /tmp/build.log
          if-no-files-found: warn

      - name: Enforce requested command results
        if: always()
        shell: bash
        run: |
          test "${{ steps.validate.outputs.status }}" = "0"
          test "${{ steps.build.outputs.status }}" = "0"
