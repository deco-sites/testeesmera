name: Apply PR5 gallery behavior
on:
  push:
    branches: [agent/gallery-pr5-behavior]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/gallery-pr5-behavior
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply PR5 transform
        run: |
          python3 scripts/_tmp_pr5_apply.py
          python3 scripts/_tmp_pr5_typefix.py
      - name: Format changed files
        run: deno fmt islands/ProductModal.tsx static/esmera-product-modal.css routes/_app.tsx tests/product/product_modal_contract_test.ts tests/product/product_modal_cache_contract_test.ts scripts/ci/product-modal-media-fidelity.mjs
      - name: Check
        run: deno task check
      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          deno task test > pr5-test.txt 2>&1
          status=$?
          cat pr5-test.txt
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pr5-test-diagnostics
          path: pr5-test.txt
      - name: Stop on test failure
        if: steps.test.outputs.exit_code != '0'
        run: exit 1
      - name: Commit verified PR5 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add islands/ProductModal.tsx static/esmera-product-modal.css routes/_app.tsx tests/product/product_modal_contract_test.ts tests/product/product_modal_cache_contract_test.ts scripts/ci/product-modal-media-fidelity.mjs
          git commit -m 'PR 5/6: implement gallery behavior contract'
          git push origin HEAD:agent/gallery-pr5-behavior
