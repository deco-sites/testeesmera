name: Gallery PR2 apply
on:
  push:
    branches: [agent/gallery-pr2-media-contract]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply source and test changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('lib/payload/adapters.ts')
          s = p.read_text().replace(
            'preferred: "thumb" | "card" | "wide" | "territory" | "original" = "original",',
            'preferred: "thumb" | "card" | "gallery" | "wide" | "territory" | "original" = "original",'
          )
          p.write_text(s)

          p = Path('islands/ProductModal.tsx')
          s = p.read_text().replace('\ntype RuntimeGalleryMedia = EsmeraObject["gallery"][number];\n', '\n')
          s = s.replace('media?: RuntimeGalleryMedia,', 'media?: EsmeraObject["gallery"][number],')
          p.write_text(s)

          p = Path('tests/payload/media_test.ts')
          s = p.read_text()
          if 'gallery rendition preserves derivative and original dimensions' not in s:
            s += '''\n\nDeno.test("gallery rendition preserves derivative and original dimensions", () => {\n  const resolved = resolvePayloadMedia({\n    id: 4, url: "/media/original-portrait.jpg", width: 1200, height: 1600,\n    alt: "Retrato", _status: "published",\n    sizes: { gallery: { url: "/media/portrait-gallery.jpg", width: 1350, height: 1800 } },\n  }, "https://cms.example.com", "gallery");\n  assertEquals(resolved?.url, "https://cms.example.com/media/portrait-gallery.jpg");\n  assertEquals(resolved?.width, 1350);\n  assertEquals(resolved?.height, 1800);\n  assertEquals(resolved?.fullUrl, "https://cms.example.com/media/original-portrait.jpg");\n  assertEquals(resolved?.fullWidth, 1200);\n  assertEquals(resolved?.fullHeight, 1600);\n});\n\nDeno.test("gallery falls back to the original when the derivative is missing", () => {\n  const resolved = resolvePayloadMedia({\n    id: 5, url: "/media/legacy-portrait.jpg", width: 1000, height: 1500,\n    alt: "Legado", _status: "published",\n    sizes: { wide: { url: "/media/legacy-wide.jpg", width: 1800, height: 1200 } },\n  }, "https://cms.example.com", "gallery");\n  assertEquals(resolved?.url, "https://cms.example.com/media/legacy-portrait.jpg");\n  assertEquals(resolved?.width, 1000);\n  assertEquals(resolved?.height, 1500);\n  assertEquals(resolved?.fullWidth, 1000);\n  assertEquals(resolved?.fullHeight, 1500);\n});\n'''
          p.write_text(s)

          p = Path('tests/payload/storefront_products_test.ts')
          s = p.read_text()
          if 'toProductGallery' not in s:
            s = s.replace('import { assertEquals } from "@std/assert";\n', 'import { assertEquals } from "@std/assert";\nimport { toProductGallery } from "../../lib/payload/adapters.ts";\nimport type { PayloadProduct } from "../../lib/payload/types.ts";\n')
            s += '''\n\nDeno.test("product gallery exposes derivative and original dimensions", () => {\n  const product = {\n    gallery: [{\n      image: {\n        id: 10, url: "/media/original.jpg", width: 1200, height: 1600,\n        alt: "Objeto", _status: "published",\n        sizes: { gallery: { url: "/media/gallery.jpg", width: 1350, height: 1800 } },\n      },\n      alt: "Objeto na galeria", mediaKey: "cover-main", role: "cover",\n    }],\n  } as PayloadProduct;\n  const [media] = toProductGallery(product, "https://cms.example.com");\n  assertEquals(media.width, 1350);\n  assertEquals(media.height, 1800);\n  assertEquals(media.fullWidth, 1200);\n  assertEquals(media.fullHeight, 1600);\n  assertEquals(media.fullUrl, "https://cms.example.com/media/original.jpg");\n  assertEquals(media.key, "cover-main");\n  assertEquals(media.role, "cover");\n});\n'''
          p.write_text(s)
          PY
          deno fmt lib/payload/adapters.ts islands/ProductModal.tsx tests/payload/media_test.ts tests/payload/storefront_products_test.ts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/payload/adapters.ts islands/ProductModal.tsx tests/payload/media_test.ts tests/payload/storefront_products_test.ts
          git commit -m "PR 2/6: type gallery media contract"
          git push
