name: Apply PR4 fidelity fix
on:
  push:
    branches: [agent/gallery-pr4-geometry]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/gallery-pr4-geometry
          fetch-depth: 0
      - name: Make containment explicit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('static/esmera-product-modal.css')
          s=p.read_text()
          selector='.esv-product-modal-image img {'
          start=s.index(selector)
          close=s.index('\n}', start)
          block=s[start:close]
          if 'object-fit: contain;' not in block:
            pos=block.index('object-position: center;')
            block=block[:pos]+'object-fit: contain;\n  '+block[pos:]
            s=s[:start]+block+s[close:]
            p.write_text(s)
          PY
          git diff -- static/esmera-product-modal.css
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/esmera-product-modal.css
          git commit -m 'fix(modal): keep explicit contained media'
          git push origin HEAD:agent/gallery-pr4-geometry
