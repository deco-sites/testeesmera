name: Align PR4 mixed-ratio CI contract
on:
  push:
    branches: [agent/gallery-pr4-geometry]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/gallery-pr4-geometry
          fetch-depth: 0
      - name: Align expected mixed composition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/ci/product-modal-media-fidelity.mjs')
          s=p.read_text()
          old='''    !mixedFirstClass?.includes("is-pair") ||\n    !mixedSecondClass?.includes("is-single")'''
          new='''    !mixedFirstClass?.includes("is-mounted") ||\n    !mixedSecondClass?.includes("is-single")'''
          if old not in s:
            raise SystemExit('legacy mixed-ratio expectation not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit contract update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ci/product-modal-media-fidelity.mjs
          git commit -m 'test(modal): align mixed-ratio geometry contract'
          git push origin HEAD:agent/gallery-pr4-geometry
