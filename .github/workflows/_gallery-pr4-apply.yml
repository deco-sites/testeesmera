name: Apply PR4 gallery geometry
on:
  push:
    branches: [agent/gallery-pr4-geometry]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/gallery-pr4-geometry
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply geometry refactor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          modal = Path('islands/ProductModal.tsx')
          s = modal.read_text()
          s = s.replace('  mediaAspectRatio,\n', '')
          s = re.sub(r'\n// PR 3 keeps the previous frame geometry until PR 4 moves the stage ratio to CSS\.\nfunction legacyGalleryFrameRatio\([\s\S]*?\n}\n\ninterface GalleryFrameProps', '\ninterface GalleryFrameProps', s, count=1)
          s = s.replace('  frameRatio: number;\n', '')
          s = s.replace('  frameRatio,\n', '')
          s = s.replace('    <div\n      class={`esv-product-modal-gallery-frame is-${view}`}\n      style={`--esv-modal-gallery-ratio:${frameRatio}`}\n    >', '    <div class={`esv-product-modal-gallery-frame is-${view}`}>')
          s = s.replace('''              class={`esv-product-modal-slide is-${\n                pairPresentation ? "pair" : "single"\n              }${plateIndex === activeIndex ? " is-active" : ""}`}''', '''              class={`esv-product-modal-slide ${\n                plate.mount === "mounted"\n                  ? "is-mounted"\n                  : plate.columns === 2\n                  ? "is-pair"\n                  : "is-single"\n              }${plateIndex === activeIndex ? " is-active" : ""}`}''')
          s = re.sub(r'\n\s*\{plate\.mount === "mounted" && \(\n\s*<div class="esv-product-modal-empty-cell" aria-hidden="true" />\n\s*\)\}', '', s, count=1)
          s = re.sub(r'\n  const desktopFrameRatio = useMemo\([\s\S]*?\n  \);\n  const compactFrameRatio = useMemo\([\s\S]*?\n  \);', '', s, count=1)
          s = s.replace('            frameRatio={desktopFrameRatio}\n', '')
          s = s.replace('            frameRatio={compactFrameRatio}\n', '')
          modal.write_text(s)

          css = Path('static/esmera-product-modal.css')
          c = css.read_text()
          c = re.sub(r'''\.esv-product-modal \{\n  position: relative;\n  display: grid;\n  grid-template-columns: minmax\(0, 1\.42fr\) minmax\(340px, \.72fr\);\n  width: min\(1440px, 100%, calc\(88dvh \* 1\.8\)\);\n  height: auto;\n  max-height: 88dvh;''', '''.esv-product-modal {\n  --esv-modal-buybox-w: clamp(380px, 27vw, 440px);\n  --esv-modal-w: min(1440px, 96vw, calc(88dvh * 1.5 + var(--esv-modal-buybox-w)));\n  position: relative;\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) var(--esv-modal-buybox-w);\n  width: var(--esv-modal-w);\n  height: auto;''', c, count=1)
          c = re.sub(r'''/\* Orientation-aware gallery\. The inline ratio is computed from Payload media\. \*/\n\.esv-product-modal-gallery-frame \{[\s\S]*?\n}\n\n\.esv-product-modal-gallery-frame\.is-compact''', '''/* Canonical gallery stage. Ratio belongs to the brand, not to each file. */\n.esv-product-modal-gallery-frame {\n  --esv-stage-inset: clamp(20px, 2.4vw, 48px);\n  position: relative;\n  width: 100%;\n  height: auto;\n  min-width: 0;\n  min-height: 0;\n  aspect-ratio: 3 / 2;\n  justify-self: stretch;\n  overflow: hidden;\n  background: var(--bg);\n  --esv-gallery-pair-gap: 0px;\n}\n\n.esv-product-modal-gallery-frame.is-compact''', c, count=1)
          c = c.replace('''.esv-product-modal-slide.is-pair {\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: var(--esv-gallery-pair-gap);\n}\n''', '''.esv-product-modal-slide.is-pair {\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: var(--esv-gallery-pair-gap);\n}\n\n.esv-product-modal-slide.is-mounted {\n  grid-template-columns: 50%;\n  justify-content: center;\n}\n''')
          c = re.sub(r'''\.esv-product-modal-image \{[\s\S]*?\n}\n\n\.esv-product-modal-empty-cell \{[\s\S]*?\n}\n\n\.esv-product-modal-image img \{[\s\S]*?\n}\n''', '''.esv-product-modal-image {\n  appearance: none;\n  position: relative;\n  display: grid;\n  place-items: center;\n  min-width: 0;\n  min-height: 0;\n  width: 100%;\n  height: 100%;\n  padding: var(--esv-stage-inset);\n  overflow: hidden;\n  border: 0;\n  background: transparent;\n  cursor: zoom-in;\n}\n\n.esv-product-modal-image img {\n  display: block;\n  width: auto;\n  height: auto;\n  max-width: 100%;\n  max-height: 100%;\n  object-position: center;\n}\n''', c, count=1)
          c = c.replace('''.esv-product-modal-buybox {\n  display: flex;\n  flex-direction: column;\n  min-width: 0;\n  min-height: 0;\n  overflow: hidden;''', '''.esv-product-modal-buybox {\n  display: flex;\n  flex-direction: column;\n  min-width: 0;\n  min-height: 0;\n  overflow-y: auto;''')
          c = c.replace('''  overflow-y: auto;\n  overscroll-behavior: contain;''', '''  overflow-y: visible;\n  overscroll-behavior: contain;''', 1)
          c = c.replace('''.esv-product-modal-add {\n  appearance: none;''', '''.esv-product-modal-add {\n  appearance: none;\n  position: sticky;\n  z-index: 4;\n  bottom: 0;''')
          c = c.replace('''.esv-product-modal-related-media,\n.esv-product-modal-related-skeleton > span {\n  display: block;\n  width: 100%;\n  aspect-ratio: 4 / 5;''', '''.esv-product-modal-related-media,\n.esv-product-modal-related-skeleton > span {\n  --esv-related-card-ratio: 4 / 5;\n  display: block;\n  width: 100%;\n  aspect-ratio: var(--esv-related-card-ratio);''')
          c = c.replace('''@media (max-width: 1023.98px) {\n  .esv-product-modal-gallery-frame.is-desktop {''', '''@media (max-width: 1023.98px) {\n  .esv-product-modal-gallery-frame {\n    aspect-ratio: 1 / 1;\n  }\n\n  .esv-product-modal-gallery-frame.is-desktop {''')
          c = c.replace('''@media (max-width: 767px) {\n  .esv-product-modal-backdrop {''', '''@media (max-width: 767px) {\n  .esv-product-modal-gallery-frame {\n    --esv-stage-inset: 14px;\n  }\n\n  .esv-product-modal-backdrop {''')
          css.write_text(c)

          test = Path('tests/product/product_modal_contract_test.ts')
          t = test.read_text()
          t = t.replace('  assertStringIncludes(modal, "esv-product-modal-empty-cell");\n', '  assertFalse(modal.includes("esv-product-modal-empty-cell"));\n')
          t = t.replace('  assertStringIncludes(css, ".esv-product-modal-empty-cell");\n', '  assertFalse(css.includes(".esv-product-modal-empty-cell"));\n')
          t = t.replace('  assertStringIncludes(css, ".esv-product-modal-slide.is-pair");\n', '  assertStringIncludes(css, ".esv-product-modal-slide.is-pair");\n  assertStringIncludes(css, ".esv-product-modal-slide.is-mounted");\n  assertStringIncludes(css, "aspect-ratio: 3 / 2");\n  assertStringIncludes(css, "aspect-ratio: 1 / 1");\n  assertFalse(css.includes("--esv-modal-gallery-ratio"));\n')
          test.write_text(t)
          PY
      - name: Format PR4 files
        run: deno fmt islands/ProductModal.tsx static/esmera-product-modal.css tests/product/product_modal_contract_test.ts
      - name: Check
        run: deno task check
      - name: Test
        run: deno task test
      - name: Verify PR4 invariants
        shell: bash
        run: |
          ! grep -R --line-number -- '--esv-modal-gallery-ratio' islands/ProductModal.tsx static/esmera-product-modal.css
          ! grep -n '!important' static/esmera-product-modal.css
          ! grep -n 'esv-product-modal-empty-cell' islands/ProductModal.tsx static/esmera-product-modal.css
      - name: Commit verified PR4 implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add islands/ProductModal.tsx static/esmera-product-modal.css tests/product/product_modal_contract_test.ts
          git commit -m 'PR 4/6: fix gallery stage geometry'
          git push origin HEAD:agent/gallery-pr4-geometry
