name: Gallery PR2 bootstrap
on:
  push:
    branches: [agent/gallery-pr2-media-contract]
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/gallery-pr2-editor.yml')
          s = p.read_text()
          needle = "      - name: Apply PR2 media contract\n"
          if 'denoland/setup-deno@v2' not in s:
              s = s.replace(needle, "      - uses: denoland/setup-deno@v2\n        with:\n          deno-version: v2.x\n" + needle)
          p.write_text(s)
          PY
          git rm .github/workflows/gallery-pr2-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: enable Deno in PR2 editor"
          git push
