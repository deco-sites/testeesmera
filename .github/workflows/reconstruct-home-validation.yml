name: Reconstruct Home validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    env:
      PAYLOAD_API_URL: https://esmeracms-green.vercel.app
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: generated-files
            timeout: 8
            command: deno task gen && git diff --exit-code -- manifest.gen.ts fresh.gen.ts
          - name: format
            timeout: 4
            command: deno fmt --check
          - name: lint
            timeout: 5
            command: deno lint
          - name: typecheck
            timeout: 6
            command: deno check dev.ts main.ts
          - name: tests
            timeout: 8
            command: deno test -A
          - name: validate-endpoint
            timeout: 6
            command: deno task validate
          - name: build
            timeout: 12
            command: deno task build
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run ${{ matrix.name }}
        shell: bash
        env:
          GATE_COMMAND: ${{ matrix.command }}
        run: |
          set +e
          bash -lc "$GATE_COMMAND" > /tmp/gate.log 2>&1
          status=$?
          echo "===== ${{ matrix.name }}: last 250 lines ====="
          tail -n 250 /tmp/gate.log
          if [ "${{ matrix.name }}" = "validate-endpoint" ] && \
             [ "$status" -ne 0 ] && \
             grep -q "403 Forbidden" /tmp/gate.log; then
            echo "::warning::The external Deco validator returned 403 Forbidden; project gates continue independently."
            exit 0
          fi
          exit "$status"
