name: Editorial media, product modal and Matter validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply guarded header cleanup
        run: python3 scripts/header_cleanup.py

      - name: Verify cleanup diff
        shell: bash
        run: |
          git diff --check
          git diff --stat

      - name: Commit cleaned header sources
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No cleanup changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/esmera-master.css static/esmera-commerce-refine.css static/esmera-finish.css islands/EsmeraHeader.tsx
          git commit -m "refactor(header): remove legacy shell competition"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
