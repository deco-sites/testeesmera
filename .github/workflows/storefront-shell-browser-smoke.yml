name: Storefront shell browser smoke

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAYLOAD_API_URL: https://esmeracms-green.vercel.app
      PORT: "8000"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build site
        run: deno task build
      - name: Start preview
        shell: bash
        run: |
          deno task preview > /tmp/esmera-preview.log 2>&1 &
          echo $! > /tmp/esmera-preview.pid
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/esmera-preview.log
          exit 1
      - name: Install Chromium smoke runner
        shell: bash
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Exercise storefront shell
        shell: bash
        run: |
          cat > /tmp/storefront-smoke.mjs <<'JS'
          import { chromium } from "playwright";

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const errors = [];
          page.on("pageerror", (error) => errors.push(String(error)));
          page.on("console", (message) => {
            if (message.type() === "error") errors.push(message.text());
          });

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const isKnownDecoPreviewNoise = (message) =>
            message.includes("Cannot read properties of undefined (reading 'state')") ||
            message.includes("Hydration failed: Expected a matching");

          await page.goto("http://127.0.0.1:8000/", {
            waitUntil: "networkidle",
            timeout: 120000,
          });
          await page.waitForSelector(".esv-header", { state: "visible" });
          await page.waitForSelector("#footer", { state: "attached" });

          const geometry = await page.evaluate(() => ({
            viewport: document.documentElement.clientWidth,
            scrollWidth: document.documentElement.scrollWidth,
            footerCount: document.querySelectorAll("#footer").length,
          }));
          assert(
            geometry.scrollWidth <= geometry.viewport + 1,
            "horizontal overflow detected",
          );
          assert(
            geometry.footerCount === 1,
            `expected one footer, got ${geometry.footerCount}`,
          );

          await page.evaluate(() => scrollTo(0, 160));
          await page.waitForFunction(() =>
            document.querySelector(".esv-header")?.classList.contains("is-scrolled")
          );
          const originalScroll = await page.evaluate(() => scrollY);

          await page.getByRole("button", { name: "Abrir menu" }).click();
          await page.waitForSelector(".esv-header-panel-menu", { state: "visible" });
          assert(
            await page.evaluate(() => document.body.style.position === "fixed"),
            "menu did not lock body scroll",
          );
          await page.getByRole("button", { name: /Fechar menu/i }).click();
          await page.waitForSelector(".esv-header-panel-menu", { state: "detached" });
          const afterMenu = await page.evaluate(() => scrollY);
          assert(
            Math.abs(afterMenu - originalScroll) <= 2,
            `menu changed scroll position: ${originalScroll} -> ${afterMenu}`,
          );

          await page.getByRole("button", { name: "Buscar objetos" }).click();
          await page.waitForSelector("#esv-search-input", { state: "visible" });
          assert(
            await page.evaluate(() => document.body.style.position === "fixed"),
            "search did not lock body scroll",
          );
          await page.getByRole("button", { name: /Fechar busca/i }).click();

          await page.getByRole("button", { name: /Carrinho, .* itens/i }).click();
          await page.waitForSelector(".esv-cart-panel", { state: "visible" });
          assert(
            await page.evaluate(() => document.body.style.position === "fixed"),
            "cart did not lock body scroll",
          );
          await page.getByRole("button", { name: /Fechar carrinho/i }).click();

          await page.evaluate(() => scrollTo(0, document.documentElement.scrollHeight));
          await page.waitForTimeout(1200);
          const heightA = await page.evaluate(() => document.documentElement.scrollHeight);
          await page.waitForTimeout(1200);
          const heightB = await page.evaluate(() => document.documentElement.scrollHeight);
          assert(
            Math.abs(heightB - heightA) <= 4,
            `document height unstable near footer: ${heightA} -> ${heightB}`,
          );

          const finalGeometry = await page.evaluate(() => ({
            viewport: document.documentElement.clientWidth,
            scrollWidth: document.documentElement.scrollWidth,
          }));
          assert(
            finalGeometry.scrollWidth <= finalGeometry.viewport + 1,
            "horizontal overflow appeared after interactions",
          );

          const relevantErrors = errors.filter((message) =>
            !isKnownDecoPreviewNoise(message)
          );
          assert(
            relevantErrors.length === 0,
            `relevant browser errors: ${relevantErrors.join(" | ")}`,
          );

          await page.screenshot({
            path: "/tmp/storefront-shell-mobile.png",
            fullPage: false,
          });
          await browser.close();
          console.log(JSON.stringify({
            geometry,
            heightA,
            heightB,
            finalGeometry,
            recordedPreviewNoise: errors.filter(isKnownDecoPreviewNoise),
          }));
          JS
          node /tmp/storefront-smoke.mjs
      - name: Show preview logs on failure
        if: failure()
        run: cat /tmp/esmera-preview.log
