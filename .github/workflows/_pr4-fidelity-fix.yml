name: Apply PR4 fidelity fix
on:
  push:
    branches: [agent/gallery-pr4-geometry]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/gallery-pr4-geometry
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Make containment explicit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('static/esmera-product-modal.css')
          s=p.read_text()
          marker='.esv-product-modal-image img {'
          start=s.index(marker)
          end=s.index('\n}', start)
          block=s[start:end]
          if 'object-fit: contain;' not in block:
            block=block.replace('  object-position: center;', '  object-fit: contain;\n  object-position: center;')
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
          deno fmt static/esmera-product-modal.css
          grep -A10 -F '.esv-product-modal-image img {' static/esmera-product-modal.css | grep -F 'object-fit: contain;'
      - name: Check
        run: deno task check
      - name: Test
        run: deno task test
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/esmera-product-modal.css
          git commit -m 'fix(modal): keep explicit contained media'
          git push origin HEAD:agent/gallery-pr4-geometry
