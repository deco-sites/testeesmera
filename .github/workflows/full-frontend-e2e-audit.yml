name: Full frontend E2E audit

on:
  push:
    branches:
      - agent/full-frontend-e2e-audit-20260812
    paths:
      - "scripts/ci/full-frontend-audit.mjs"
      - ".github/workflows/full-frontend-e2e-audit.yml"

permissions:
  contents: read

jobs:
  full-frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PAYLOAD_API_URL: https://esmeracms-green.vercel.app
      PORT: "8000"
      BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Static validation
        run: |
          deno lint
          deno check dev.ts main.ts

      - name: Full unit and contract suite
        run: deno test -A

      - name: Production build
        run: deno task build

      - name: Start production preview
        shell: bash
        run: |
          deno task preview > /tmp/esmera-full-audit-preview.log 2>&1 &
          for attempt in $(seq 1 120); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/esmera-full-audit-preview.log
          exit 1

      - name: Install browser audit tools
        run: |
          npm install --no-save playwright@1.54.2 axe-core@4.10.3
          npx playwright install --with-deps chromium

      - name: Certified Hero to Maison regression test
        run: node scripts/ci/home-hygiene.mjs

      - name: Certified product media and zoom regression test
        run: node scripts/ci/product-modal-media-fidelity.mjs

      - name: Full route, navigation and interaction audit
        run: node scripts/ci/full-frontend-audit.mjs

      - name: Preserve preview log
        if: always()
        run: |
          mkdir -p full-frontend-audit-artifacts/runtime
          cp /tmp/esmera-full-audit-preview.log full-frontend-audit-artifacts/runtime/preview.log || true

      - name: Upload complete audit evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: full-frontend-e2e-audit-pack
          path: |
            full-frontend-audit-artifacts
            home-hygiene-artifacts
            media-fidelity-artifacts
          if-no-files-found: warn
          retention-days: 14
