name: Apply PR6 gallery hardening
on:
  push:
    branches: [agent/gallery-pr6-hardening]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/gallery-pr6-hardening
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply hardening transform
        run: python3 scripts/_tmp_pr6_apply.py
      - name: Format changed files
        run: deno fmt static/esmera-product-modal.css routes/_app.tsx tests/product/product_modal_contract_test.ts tests/product/product_modal_cache_contract_test.ts tests/esmera/product_card_css_test.ts scripts/ci/product-modal-media-fidelity.mjs
      - name: Final forbidden-pattern grep
        shell: bash
        run: |
          ! grep -n -- '--esv-modal-gallery-ratio' static/esmera-product-modal.css islands/ProductModal.tsx
          ! grep -n '!important' static/esmera-product-modal.css
          ! grep -n 'object-fit: cover' static/esmera-product-modal.css
          ! grep -En 'gallerySize|galleryFrameRef|ResizeObserver' islands/ProductModal.tsx
          ! grep -En 'is-two-stage|is-double|is-multiple|esv-product-modal-empty-cell' static/esmera-product-modal.css islands/ProductModal.tsx
          grep -n 'grid-template-columns: repeat(2, minmax(0, 1fr));' static/esmera-product-modal.css
      - name: Check
        run: deno task check
      - name: Test
        run: deno task test
      - name: Assert CSS line count decreased
        shell: bash
        run: |
          base_lines=$(git show HEAD:static/esmera-product-modal.css | wc -l)
          next_lines=$(wc -l < static/esmera-product-modal.css)
          echo "CSS lines: ${base_lines} -> ${next_lines}"
          test "$next_lines" -lt "$base_lines"
      - name: Commit verified PR6 changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/esmera-product-modal.css routes/_app.tsx tests/product/product_modal_contract_test.ts tests/product/product_modal_cache_contract_test.ts tests/esmera/product_card_css_test.ts scripts/ci/product-modal-media-fidelity.mjs
          git commit -m 'PR 6/6: harden and clean gallery modal'
          git push origin HEAD:agent/gallery-pr6-hardening
