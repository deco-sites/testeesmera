name: Gallery PR2 E2E fix

on:
  push:
    branches:
      - agent/gallery-pr2-media-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply deterministic patch
        run: python scripts/ci/_gallery_pr2_patch.py
      - name: Commit E2E alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/ci/_gallery_pr2_patch.py
          git add scripts/ci/product-modal-media-fidelity.mjs
          git commit -m "test: align media fidelity E2E with canonical modal"
          git push
