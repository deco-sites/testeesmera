name: Apply modal viewport geometry correction

on:
  push:
    branches:
      - agent/modal-viewport-geometry

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/modal-viewport-geometry
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Correct modal viewport geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('static/esmera-product-modal.css')
          css = css_path.read_text()

          css = css.replace(
              '  --esv-modal-w: min(1440px, 96vw, calc(88dvh * 1.5 + var(--esv-modal-buybox-w)));',
              '  --esv-modal-w: min(1440px, 96vw, calc(132dvh + var(--esv-modal-buybox-w)));',
          )

          old_buybox = '''.esv-product-modal-buybox {\n  display: flex;\n  flex-direction: column;\n  min-width: 0;\n  min-height: 0;\n  overflow-y: auto;\n  border-left: 1px solid var(--line);\n}'''
          new_buybox = '''.esv-product-modal-buybox {\n  display: flex;\n  flex-direction: column;\n  min-width: 0;\n  min-height: 0;\n  overflow: hidden;\n  contain: size;\n  border-left: 1px solid var(--line);\n}'''
          if old_buybox not in css:
              raise SystemExit('buybox source block not found')
          css = css.replace(old_buybox, new_buybox)

          old_scroll = '''.esv-product-modal-buybox-scroll {\n  flex: 1 1 auto;\n  min-width: 0;\n  min-height: 0;\n  padding: clamp(54px, 5vw, 78px) clamp(34px, 4vw, 64px) 30px;\n  overflow-y: visible;\n  overscroll-behavior: contain;\n}'''
          new_scroll = '''.esv-product-modal-buybox-scroll {\n  flex: 1 1 auto;\n  min-width: 0;\n  min-height: 0;\n  padding: clamp(54px, 5vw, 78px) clamp(34px, 4vw, 64px) 30px;\n  overflow-y: auto;\n  overscroll-behavior: contain;\n}'''
          if old_scroll not in css:
              raise SystemExit('buybox scroll source block not found')
          css = css.replace(old_scroll, new_scroll)

          css = css.replace(
              '@media (max-width: 1023.98px) {',
              '@media (max-width: 1023.98px),\n  (max-width: 1180px) and (orientation: portrait) {',
              1,
          )

          if '88dvh * 1.5' in css:
              raise SystemExit('legacy multiplication remains')
          if 'contain: size;' not in css:
              raise SystemExit('size containment missing')
          if '(max-width: 1180px) and (orientation: portrait)' not in css:
              raise SystemExit('large tablet portrait fallback missing')
          css_path.write_text(css)

          revision_old = '2026-08-12-gallery-hardening-v25'
          revision_new = '2026-08-12-gallery-viewport-v26'
          revision_paths = [
              Path('routes/_app.tsx'),
              Path('scripts/ci/product-modal-media-fidelity.mjs'),
              Path('tests/product/product_modal_cache_contract_test.ts'),
              Path('tests/esmera/product_card_css_test.ts'),
          ]
          for path in revision_paths:
              text = path.read_text()
              if revision_old not in text:
                  raise SystemExit(f'revision token missing in {path}')
              path.write_text(text.replace(revision_old, revision_new))

          test_path = Path('tests/product/product_modal_contract_test.ts')
          test = test_path.read_text()
          anchor = '  assertStringIncludes(css, "aspect-ratio: 1 / 1");\n'
          addition = '''  assertStringIncludes(\n    css,\n    "calc(132dvh + var(--esv-modal-buybox-w))",\n  );\n  assertFalse(css.includes("88dvh * 1.5"));\n  assertStringIncludes(css, "contain: size;");\n  assertStringIncludes(\n    css,\n    "(max-width: 1180px) and (orientation: portrait)",\n  );\n'''
          if anchor not in test:
              raise SystemExit('modal contract test anchor not found')
          test = test.replace(anchor, anchor + addition, 1)
          test_path.write_text(test)
          PY

          deno fmt static/esmera-product-modal.css routes/_app.tsx scripts/ci/product-modal-media-fidelity.mjs tests/product/product_modal_cache_contract_test.ts tests/esmera/product_card_css_test.ts tests/product/product_modal_contract_test.ts
      - name: Validate
        run: |
          deno task check
          deno task test
      - name: Commit source correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add static/esmera-product-modal.css routes/_app.tsx scripts/ci/product-modal-media-fidelity.mjs tests/product/product_modal_cache_contract_test.ts tests/esmera/product_card_css_test.ts tests/product/product_modal_contract_test.ts
          git commit -m "fix(modal): constrain desktop and large tablet geometry"
          git push origin HEAD:agent/modal-viewport-geometry
