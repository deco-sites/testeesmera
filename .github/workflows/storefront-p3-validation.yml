name: Storefront P3 validation

on:
  push:
    branches: [main]
    paths:
      - "components/esmera/ObjectCard.tsx"
      - "components/esmera/StorefrontSEO.tsx"
      - "lib/esmera/canonicalRoutes.ts"
      - "routes/pagina/[slug].tsx"
      - "routes/sitemap.xml.ts"
      - "sections/Esmera/PayloadHome.tsx"
      - "tests/seo/storefront_p3_contract_test.ts"
      - ".github/workflows/storefront-p3-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "components/esmera/ObjectCard.tsx"
      - "components/esmera/StorefrontSEO.tsx"
      - "lib/esmera/canonicalRoutes.ts"
      - "routes/pagina/[slug].tsx"
      - "routes/sitemap.xml.ts"
      - "sections/Esmera/PayloadHome.tsx"
      - "tests/seo/storefront_p3_contract_test.ts"
      - ".github/workflows/storefront-p3-validation.yml"

permissions:
  contents: read

jobs:
  p3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PAYLOAD_API_URL: https://esmeracms-green.vercel.app
      PORT: "8000"
    steps:
      - uses: actions/checkout@v6

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format P3 files
        run: >-
          deno fmt --check
          components/esmera/ObjectCard.tsx
          lib/esmera/canonicalRoutes.ts
          'routes/pagina/[slug].tsx'
          routes/sitemap.xml.ts
          sections/Esmera/PayloadHome.tsx
          tests/seo/storefront_p3_contract_test.ts
          .github/workflows/storefront-p3-validation.yml

      - name: Lint P3 files
        run: >-
          deno lint
          components/esmera/ObjectCard.tsx
          lib/esmera/canonicalRoutes.ts
          'routes/pagina/[slug].tsx'
          routes/sitemap.xml.ts
          sections/Esmera/PayloadHome.tsx
          tests/seo/storefront_p3_contract_test.ts

      - name: Typecheck
        run: deno check dev.ts main.ts

      - name: P3 contracts
        run: deno test -A tests/seo/storefront_p3_contract_test.ts

      - name: Build
        run: deno task build

      - name: Start preview
        shell: bash
        run: |
          deno task preview > /tmp/esmera-p3-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/esmera-p3-preview.log
          exit 1

      - name: Verify canonical and sitemap
        shell: bash
        run: |
          set -euo pipefail

          if ! home_html="$(curl --silent --show-error --fail http://127.0.0.1:8000/)"; then
            echo "::error title=P3 runtime::Home request failed"
            tail -n 80 /tmp/esmera-p3-preview.log || true
            exit 1
          fi
          if [[ "$home_html" != *'rel="canonical"'* ]]; then
            echo "::error title=P3 runtime::Home canonical missing"
            exit 1
          fi

          if ! sitemap="$(curl --silent --show-error --fail http://127.0.0.1:8000/sitemap.xml)"; then
            echo "::error title=P3 runtime::Sitemap request failed"
            tail -n 80 /tmp/esmera-p3-preview.log || true
            exit 1
          fi
          if [[ "$sitemap" != *'/sobre</loc>'* ]]; then
            echo "::error title=P3 runtime::Canonical /sobre missing from sitemap"
            exit 1
          fi
          if [[ "$sitemap" != *'/contato</loc>'* ]]; then
            echo "::error title=P3 runtime::Canonical /contato missing from sitemap"
            exit 1
          fi

          legacy_sobre_re='<loc>[^<]*/pagina/sobre/?</loc>'
          legacy_contato_re='<loc>[^<]*/pagina/contato/?</loc>'
          if [[ "$sitemap" =~ $legacy_sobre_re ]]; then
            echo "::error title=P3 runtime::Legacy /pagina/sobre leaked into sitemap"
            exit 1
          fi
          if [[ "$sitemap" =~ $legacy_contato_re ]]; then
            echo "::error title=P3 runtime::Legacy /pagina/contato leaked into sitemap"
            exit 1
          fi