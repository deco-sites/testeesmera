name: Format PR2 gallery files

on:
  push:
    branches:
      - agent/gallery-pr2-media-contract

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format canonical files
        run: >-
          deno fmt
          islands/ProductModal.tsx
          lib/esmera/productMediaPresentation.ts
          lib/payload/adapters.ts
          lib/payload/media.ts
          lib/payload/types.ts
          scripts/ci/editorial-modal-smoke.mjs
          scripts/ci/product-modal-media-fidelity.mjs
          tests/product/product_modal_contract_test.ts
          tests/product/product_modal_cache_contract_test.ts
          tests/product/product_media_presentation_test.ts
          tests/payload/media_test.ts
          tests/payload/storefront_products_test.ts
      - name: Commit formatter output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add islands/ProductModal.tsx lib/esmera/productMediaPresentation.ts lib/payload/adapters.ts lib/payload/media.ts lib/payload/types.ts scripts/ci/editorial-modal-smoke.mjs scripts/ci/product-modal-media-fidelity.mjs tests/product/product_modal_contract_test.ts tests/product/product_modal_cache_contract_test.ts tests/product/product_media_presentation_test.ts tests/payload/media_test.ts tests/payload/storefront_products_test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: normalize PR2 gallery formatting"
          git push
